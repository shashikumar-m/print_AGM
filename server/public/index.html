<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Print PDF</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1917;
      --border: #2e2c29;
      --accent: #e8c97a;
      --accent-dim: rgba(232,201,122,0.12);
      --text: #f0ece4;
      --muted: #7a7672;
      --danger: #e07a5f;
      --success: #81b29a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 70% 20%, rgba(232,201,122,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(128,100,50,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Grid lines background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.3;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 3rem;
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 0 1px rgba(232,201,122,0.04), 0 32px 64px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corner accent */
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 40px; height: 40px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 40px; height: 40px;
      border-bottom: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
    }

    .header {
      margin-bottom: 2.5rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 0.25rem 0.65rem;
      border-radius: 1px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.1;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* Drop zone */
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: 2px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      margin-bottom: 1.5rem;
    }

    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: block;
      opacity: 0.5;
    }

    .drop-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .drop-label strong {
      color: var(--accent);
      font-weight: 500;
    }

    .file-name {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: var(--text);
      word-break: break-all;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Toggle */
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .option-row:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .option-info { flex: 1; }

    .option-label {
      font-size: 0.78rem;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .option-desc {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.2rem;
      letter-spacing: 0.03em;
    }

    /* Custom toggle switch */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 99px;
      transition: background 0.2s;
      cursor: pointer;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
      pointer-events: none;
    }

    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); background: var(--bg); }

    /* Submit button */
    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 2px;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn .btn-text { display: inline-block; transition: transform 0.2s, opacity 0.2s; }
    .btn .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn.loading .btn-text { transform: translateY(-100%); opacity: 0; }
    .btn.loading .spinner { opacity: 1; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon {
      width: 16px; height: 16px;
      border: 2px solid transparent;
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 0.75rem 1.5rem;
      border-radius: 2px;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s;
      z-index: 999;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.success { border-color: var(--success); color: var(--success); }
    #toast.error   { border-color: var(--danger);  color: var(--danger);  }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="tag">PrintQueue v1</div>
    <h1>Send to <span>Printer</span></h1>
    <p class="subtitle">Upload a PDF and configure print settings below.</p>
  </div>

  <form id="uploadForm">
    <div class="dropzone" id="dropzone">
      <input type="file" name="pdf" id="pdfInput" accept=".pdf" required/>
      <span class="drop-icon">⌗</span>
      <div class="drop-label">Drop PDF here or <strong>browse</strong></div>
      <div class="file-name" id="fileName"></div>
    </div>

    <div class="divider"><span>Options</span></div>

    <div class="option-row">
      <div class="option-info">
        <div class="option-label">Duplex Printing</div>
        <div class="option-desc">Print on both sides of the page</div>
      </div>
      <label class="toggle">
        <input type="checkbox" name="duplex" id="duplexToggle"/>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      <span class="btn-text">Send to Printer</span>
      <span class="spinner"><span class="spin-icon"></span></span>
    </button>
  </form>
</div>

<div id="toast"></div>

<script>
  // File name display
  const pdfInput = document.getElementById('pdfInput');
  const fileNameEl = document.getElementById('fileName');
  const dropzone = document.getElementById('dropzone');

  pdfInput.addEventListener('change', () => {
    fileNameEl.textContent = pdfInput.files[0]?.name || '';
  });

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) {
      pdfInput.files = e.dataTransfer.files;
      fileNameEl.textContent = e.dataTransfer.files[0].name;
    }
  });

  // Toast helper
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => { t.className = ''; }, 3500);
  }

  // Form submit
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    btn.classList.add('loading');
    btn.disabled = true;

    const formData = new FormData(e.target);
    const duplex = formData.get('duplex') ? true : false;
    formData.set('duplex', duplex);

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const text = await res.text();
      showToast(text || 'Print job sent!', res.ok ? 'success' : 'error');
    } catch (err) {
      showToast('Failed to connect to server.', 'error');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
